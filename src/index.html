<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d1f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Resume Tailor">
  <title>Resume Tailor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header id="topbar">
    <button id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="brand">Resume Tailor</span>
    <a href="#/new" class="btn primary" aria-label="New application">+ New</a>
  </header>
  <aside id="sidebar">
    <div class="brand">Resume Tailor</div>
    <a href="#/new" id="newBtn" class="btn primary block">+ New application</a>
    <input id="search" type="search" placeholder="Search applications…">
    <nav id="appList"></nav>
    <div class="sidebar-footer">
      <a href="#/resume" data-nav="resume">Base resume</a>
      <a href="#/settings" data-nav="settings">Settings &amp; account</a>
      <div id="account"></div>
      <div id="sync" class="sync"></div>
    </div>
  </aside>
  <div id="backdrop"></div>
  <main id="main"></main>
  <div id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
